<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f"><title>AI Melli Chat</title>
<style>
:root{--bg:#0b0b0f;--panel:#111116;--panel2:#18181f;--line:#292933;--text:#f5f5f7;--muted:#9a9aa5;--accent:#10a37f;--user:#2a2a31}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:285px;background:#101014;border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}.brand{font-weight:800;font-size:18px;padding:10px 8px}.new{width:100%;background:transparent;border:1px solid #3a3a44;color:var(--text);border-radius:10px;padding:11px;cursor:pointer;text-align:right;font:inherit}.history{flex:1;overflow:auto}.history button{display:block;width:100%;background:transparent;border:0;color:#d9d9df;text-align:right;padding:10px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history button:hover{background:#1d1d24}.sidefoot{font-size:12px;color:var(--muted);padding:8px;line-height:1.8}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;background:#0c0c10}.menu{display:none;background:none;border:0;color:white;font-size:22px}.title{font-weight:700}.model{color:var(--muted);font-size:13px}.chat{flex:1;overflow:auto}.empty{max-width:760px;margin:14vh auto 0;padding:24px;text-align:center}.empty h1{font-size:32px;margin:0 0 10px}.empty p{color:var(--muted);line-height:1.8}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.suggestions button{background:#14141a;border:1px solid var(--line);color:#ddd;border-radius:12px;padding:14px;text-align:right;cursor:pointer;font:inherit}
.msg{display:flex;gap:18px;padding:24px max(20px,calc((100% - 820px)/2));line-height:1.9}.msg.user{background:var(--user)}.avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:15px}.assistant .avatar{background:var(--accent)}.user .avatar{background:#6b5cff}.bubble{min-width:0;white-space:pre-wrap;word-break:break-word}.bubble img{max-width:100%;border-radius:12px;margin-top:8px}.bubble a{color:#8dddc7}.typing{color:var(--muted)}
.composer{padding:12px max(14px,calc((100% - 820px)/2));background:linear-gradient(transparent,var(--bg) 18%)}.box{background:#15151b;border:1px solid #34343e;border-radius:16px;padding:9px;box-shadow:0 5px 30px #0007}.box textarea{width:100%;min-height:48px;max-height:180px;resize:none;background:transparent;border:0;outline:0;color:var(--text);font:inherit;line-height:1.7;padding:5px 8px}.tools{display:flex;align-items:center;gap:7px}.tool{background:#22222a;border:1px solid #33333c;color:#ddd;border-radius:9px;padding:7px 10px;cursor:pointer}.send{margin-right:auto;background:var(--text);color:#111;border:0;border-radius:10px;width:38px;height:34px;font-size:18px;cursor:pointer}.send:disabled{opacity:.35}.hint{text-align:center;color:#777;font-size:11px;padding:7px}
@media(max-width:760px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:285px;transform:translateX(-105%);transition:.2s;border-left:0;border-right:1px solid var(--line)}.sidebar.open{transform:translateX(0)}.menu{display:block}.msg{padding:20px 15px;gap:12px}.suggestions{grid-template-columns:1fr}.empty{margin-top:9vh;padding:20px}.empty h1{font-size:26px}.composer{padding:8px 9px}.top{padding:0 10px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">✦ AI Melli</div><button class="new" onclick="newChat()">＋ گفت‌وگوی جدید</button><div class="history" id="history"></div><div class="sidefoot">پنل وب پروژه <b>ai_melli</b><br>اجراها از GitHub Actions انجام می‌شوند.</div></aside>
<main class="main">
<header class="top"><button class="menu" onclick="toggleSide()">☰</button><div class="title">AI Melli <span class="model">• هوش مصنوعی ملی</span></div></header>
<section class="chat" id="chat"><div class="empty" id="empty"><h1>چطور می‌تونم کمکت کنم؟</h1><p>یک گفت‌وگوی ساده و تمیز، با دسترسی مستقیم به قابلیت‌های پروژه.</p><div class="suggestions"><button onclick="fill('یک متن حرفه‌ای برای معرفی کسب‌وکار من بنویس')">✍️ یک متن حرفه‌ای بنویس</button><button onclick="fill('یک تصویر سینمایی از یک فروشگاه مدرن طراحی کن')">🎨 یک تصویر بساز</button><button onclick="fill('آخرین اخبار هوش مصنوعی را جست‌وجو کن')">🔎 جست‌وجوی وب</button><button onclick="fill('یک ایده خلاقانه برای پروژه AI Melli بده')">💡 ایده بده</button></div></div></section>
<div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="پیامت را اینجا بنویس..." onkeydown="key(event)" oninput="resize(this)"></textarea><div class="tools"><button class="tool" onclick="choose('text')">📝 متن</button><button class="tool" onclick="choose('image')">🎨 تصویر</button><button class="tool" onclick="choose('search')">🔎 جست‌وجو</button><button class="send" id="send" onclick="send()">↑</button></div></div><div class="hint">AI Melli ممکن است پاسخ را از طریق GitHub Actions تولید کند.</div></div>
</main></div>
<script>
const owner='Aghil-Echresh',repo='ai_melli';let mode='text', chats=JSON.parse(localStorage.getItem('aimelli_chats')||'[]');
function save(){localStorage.setItem('aimelli_chats',JSON.stringify(chats))}
function newChat(){document.getElementById('chat').innerHTML='<div class="empty" id="empty"><h1>چطور می‌تونم کمکت کنم؟</h1><p>پیامت را بنویس تا شروع کنیم.</p></div>';document.getElementById('sidebar').classList.remove('open')}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function fill(x){document.getElementById('input').value=x;resize(document.getElementById('input'));document.getElementById('input').focus()}
function choose(x){mode=x;document.getElementById('input').placeholder=x==='image'?'پرامپت تصویر را بنویس...':x==='search'?'چه چیزی را جست‌وجو کنم؟':'پیامت را اینجا بنویس...'}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,180)+'px'}
function add(role,text){let c=document.getElementById('chat');document.getElementById('empty')?.remove();let d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="avatar">'+(role==='user'?'ش':'✦')+'</div><div class="bubble"></div>';d.querySelector('.bubble').textContent=text;c.appendChild(d);c.scrollTop=c.scrollHeight}
function send(){let i=document.getElementById('input'),p=i.value.trim();if(!p)return;add('user',p);chats.push({role:'user',text:p,mode});save();i.value='';resize(i);let file=mode==='image'?'smart-image-generation.yml':mode==='search'?'web-search.yml':'multi-provider-chat-g4f.yml';localStorage.setItem('ai_melli_prompt_'+file,p);add('assistant','در حال آماده‌سازی Workflow...');setTimeout(()=>{let msgs=document.querySelectorAll('.msg.assistant');let last=msgs[msgs.length-1];last.querySelector('.bubble').innerHTML='Workflow آماده است. <a target="_blank" rel="noopener" href="https://github.com/'+owner+'/'+repo+'/actions/workflows/'+file+'">اجرای '+(mode==='image'?'تصویر':mode==='search'?'جست‌وجو':'متن')+' در GitHub ↗</a><br><span class="typing">پرامپت شما در مرورگر ذخیره شده است.</span>';},450)}
function load(){let h=document.getElementById('history');h.innerHTML='';chats.filter(x=>x.role==='user').slice(-20).reverse().forEach(x=>{let b=document.createElement('button');b.textContent=x.text; b.onclick=()=>fill(x.text);h.appendChild(b)})}load()
</script></body></html>
